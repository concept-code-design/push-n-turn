; Push-n-Turn family firmware (CH552, ch55xduino)
;
;   pio run                         build push31 + push4
;   pio run -e push31 -t upload     build + flash a push31
;   pio run -e push31_neotest -t upload
;   pio run -e push4_neotest -t upload
;                                   NeoPixel pin finder (see src/neopixel_pin_test.c)
;
; The ch55xduino core, its SDCC build and the vnproch55x uploader are downloaded
; on the first build (platform-ch55x/builder/ch55x_packages.py).

[platformio]
default_envs = push31, push4

[env]
platform = symlink://platform-ch55x
board = ch552
framework = ch55xduino
lib_archive = no
monitor_speed = 115200

[env:push31]
build_flags = -DDEVICE_PUSH31

[env:push4]
build_flags = -DDEVICE_PUSH4

[env:push31_neotest]
build_flags = -DDEVICE_PUSH31 -DNEOPIXEL_PIN_TEST

[env:push4_neotest]
build_flags = -DDEVICE_PUSH4 -DNEOPIXEL_PIN_TEST
